<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>Kiosk Telefon</title><link rel="stylesheet" href="static/style.css"><script src="static/phone.js" defer></script></head><body><main class="phone"><div class="phone-layout"><aside class="phone-controls" aria-label="Telefonansicht"><label>Ausgehende Rufnummer<select id="outboundLine"></select></label><div class="tabs"><button class="button" id="showContacts">Kontakte</button><button class="button" id="showKiosks">Kiosks</button><button class="button" id="showDialer" aria-pressed="true">Wähltasten</button></div>
<label id="searchLabel" hidden>Suchen<input id="contactSearch" type="search" placeholder="Name, Raum oder Nummer" autocomplete="off"></label><p class="muted small phone-state" id="state" role="status">Verbindung wird geprüft …</p>{% if is_ingress %}<a class="button" href="setup">Einrichten</a>{% endif %}</aside><section id="contactsPanel" class="contacts" hidden></section><section id="dialerPanel"><label class="sr-only" for="number">Telefonnummer</label><input id="number" class="number" inputmode="tel" maxlength="20" autocomplete="off"><div class="dialpad"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>*</button><button>0</button><button>#</button><button>+</button><button id="delete" aria-label="Letzte Ziffer löschen">⌫</button><button id="call" class="primary" disabled aria-label="Anrufen">☎</button></div></section></div><p id="message" role="status" aria-live="polite"></p></main></body></html>
