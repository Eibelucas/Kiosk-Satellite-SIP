<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>Kiosk Telefon</title><link rel="stylesheet" href="static/style.css"><script src="static/phone.js" defer></script></head><body><main class="phone"><header><div><div class="eyebrow">KIOSK SATELLITE SIP</div><h1>Telefon.</h1><p class="muted" id="state">Verbindung wird geprüft …</p></div>{% if is_ingress %}<a class="button" href="setup">Einrichten</a>{% endif %}</header>
<div class="notice small">Gespräche laufen über das im Assistenten gewählte Audio-Ziel: Kiosk Satellite Intercom oder SIP-Telefon 100. Beim Anrufen klingelt es zuerst bei dir.</div>
<div class="phone-layout"><aside class="phone-controls" aria-label="Telefonansicht"><label>Ausgehende Rufnummer<select id="outboundLine"></select></label><div class="tabs"><button class="button" id="showContacts">Kontakte</button><button class="button" id="showKiosks">Kiosks</button><button class="button" id="showDialer">Wähltasten</button></div>
<label id="searchLabel">Suchen<input id="contactSearch" type="search" placeholder="Name, Raum oder Nummer" autocomplete="off"></label></aside><section id="contactsPanel" class="contacts"></section><section id="dialerPanel" hidden><label class="sr-only" for="number">Telefonnummer</label><input id="number" class="number" inputmode="tel" maxlength="20" autocomplete="off"><div class="dialpad"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>*</button><button>0</button><button>#</button><button>+</button><button id="delete" aria-label="Letzte Ziffer löschen">⌫</button><button id="call" class="primary" aria-label="Anrufen">☎</button></div></section></div><p id="message" role="status" aria-live="polite"></p></main></body></html>
