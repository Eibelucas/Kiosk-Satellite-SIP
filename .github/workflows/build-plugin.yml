name: Build Kiosk Satellite plugin

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build plugin
        run: |
          VERSION="0.1.0"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          python3 tools/build.py --android-platform 35 --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-satellite-sip-plugin
          path: dist/
      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/kiosk-satellite-plugin.json --clobber
