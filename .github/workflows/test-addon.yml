name: Test HAOS add-on
on:
  push:
    branches: [main]
    paths: ['kiosk_sip/**', 'tests/**', '.github/workflows/test-addon.yml', 'repository.yaml']
  pull_request:
    paths: ['kiosk_sip/**', 'tests/**', '.github/workflows/test-addon.yml', 'repository.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r kiosk_sip/requirements.txt pytest PyYAML
      - name: Configuration and API tests
        run: python -m pytest tests -q
      - name: Build amd64 add-on
        run: docker build -t kiosk-sip-test kiosk_sip
      - name: Asterisk startup and local SIP authentication test
        run: |
          docker run -d --name kiosk-sip-test kiosk-sip-test
          trap 'docker logs kiosk-sip-test; docker rm -f kiosk-sip-test' EXIT
          for attempt in $(seq 1 45); do
            if docker exec kiosk-sip-test asterisk -rx 'core show uptime' | grep -q 'System uptime'; then break; fi
            sleep 2
          done
          docker exec kiosk-sip-test asterisk -rx 'core show uptime' | grep 'System uptime'
          docker cp tests/sip_smoke.py kiosk-sip-test:/tmp/sip_smoke.py
          docker exec kiosk-sip-test /opt/venv/bin/python /tmp/sip_smoke.py
